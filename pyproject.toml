[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainbow-energy-modbus-client"
version = "0.1.0"
description = "Profile-driven client for reading energy device measurements over Modbus (serial or TCP)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Rainbow Solar" },
]
keywords = ["modbus", "inverter", "energy", "solar", "rs485"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.26.0",
  "pymodbus[serial]",
  "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/rainbow-energy/rainbow-energy-modbus-client"
Repository = "https://github.com/rainbow-energy/rainbow-energy-modbus-client"
Issues = "https://github.com/rainbow-energy/rainbow-energy-modbus-client/issues"
Documentation = "https://github.com/rainbow-energy/rainbow-energy-modbus-client#readme"

[project.scripts]
rainbow-energy-modbus-client = "rainbow_energy_modbus_client.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rainbow_energy_modbus_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=rainbow_energy_modbus_client",
  "--cov-report=term-missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
