[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainbow"
version = "0.1.0"
description = "Minimal USB-RS485 reader for a SunSynk inverter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pymodbus[serial]",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rainbow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
