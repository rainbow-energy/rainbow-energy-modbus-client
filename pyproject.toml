[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainbow"
version = "0.1.0"
description = "Minimal USB-RS485 reader for a SunSynk inverter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.26.0",
  "pymodbus[serial]",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rainbow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=rainbow",
  "--cov-report=term-missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
