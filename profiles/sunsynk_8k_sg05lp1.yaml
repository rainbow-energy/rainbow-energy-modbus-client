# SunSynk / Deye single-phase hybrid register map for SYNK-8K-SG05LP1.
# SunSynk single-phase register definitions (addresses and scales).
# Omitted for now: math sensors, non-contiguous multi-register values,
# and overlapping AUX aliases.
# Protocol stays numeric until a version-string decode exists.
# Binary switches use nonzero-after-mask = True (no explicit on value yet).
